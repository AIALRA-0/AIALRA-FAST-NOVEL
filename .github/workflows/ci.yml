name: quality-gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: node --check static/app.js
      - run: npm install --no-save --no-package-lock @playwright/test@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Start synthetic demo server
        run: |
          NOVEL_DB_PATH=/tmp/novel-atlas-ci.db python -m uvicorn app.main:app --host 127.0.0.1 --port 8766 >/tmp/novel-atlas.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8766/readyz && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8766/readyz
      - name: Browser regression
        env:
          NOVEL_ATLAS_E2E_URL: http://127.0.0.1:8766
        run: npx playwright test tests/e2e_ui.spec.js --reporter=line --workers=1
      - name: Build container
        run: docker build --tag novel-atlas:ci .
