[project]
name = "novel-atlas"
version = "2.9.6-rc.1"
description = "带原文证据的超长篇小说人物、时间与地点知识系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pypdf>=5.0",
  "python-multipart>=0.0.12",
  "shapely==2.1.2",
  "uvicorn>=0.30"
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
