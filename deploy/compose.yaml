services:
  novel-atlas:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NOVEL_BUILD_COMMIT: ${NOVEL_BUILD_COMMIT:-local}
        NOVEL_BUILD_TIME: ${NOVEL_BUILD_TIME:-local}
    image: aialra/novel-atlas:2.9.7-rc.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOVEL_ATLAS_PORT:-18765}:8080"
    environment:
      NOVEL_DB_PATH: /data/novel_atlas.db
      NOVEL_MAX_UPLOAD_MB: ${NOVEL_MAX_UPLOAD_MB:-30}
      NOVEL_BUILD_COMMIT: ${NOVEL_BUILD_COMMIT:-local}
      NOVEL_BUILD_TIME: ${NOVEL_BUILD_TIME:-local}
    volumes:
      - novel_atlas_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  novel_atlas_data:
